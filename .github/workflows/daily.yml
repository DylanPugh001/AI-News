name: Daily AI digest

on:
  schedule:
    # 04:17 UTC = 06:17 South Africa time. Not on the hour on purpose: GitHub
    # drops or delays scheduled runs at :00 when its queue is overloaded.
    - cron: "17 4 * * *"
  workflow_dispatch: {}    # lets you press "Run workflow" to test

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: dtpugh026@gmail.com
